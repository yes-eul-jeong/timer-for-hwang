name: ttaeng

x-app: &app
  build:
    context: ..
    dockerfile: docker/Dockerfile
  image: ttaeng:dev
  working_dir: /app
  volumes:
    - ..:/app:delegated
    # 리눅스용 네이티브 바이너리(esbuild, rollup)가 호스트와 섞이지 않게 분리한다
    - node_modules:/app/node_modules

services:
  # 개발 서버. http://localhost:5180/timer-for-hwang/
  # 호스트 5173 은 다른 프로젝트(gbe-app)가 쓰고 있어서 5180 으로 연결한다
  dev:
    <<: *app
    ports:
      - "5180:5173"
    command: npm run dev

  # 일회성 명령 실행용. 설치, 빌드, 테스트
  app:
    <<: *app

volumes:
  node_modules:
